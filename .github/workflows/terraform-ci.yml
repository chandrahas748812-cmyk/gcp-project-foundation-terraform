# Terraform CI — safe by design.
#
#  PRs:            fmt -> init -> validate -> tfsec scan -> plan (review artifact)
#  Push to main:   same checks, then plan again. Apply NEVER runs here.
#  Production:     a human runs `terraform apply` from an approved plan,
#                  behind the `production` environment approval gate.
#
# Authentication: Workload Identity Federation (WIF) — short-lived tokens,
# no long-lived service-account JSON keys. See README "Authentication".

name: terraform-ci

on:
  pull_request:
    paths:
      - "**.tf"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - ".github/workflows/terraform-ci.yml"

# Workflow-level floor: read the repo, comment on PRs. Jobs that need more
# (the plan job needs an OIDC token for WIF) declare it themselves below.
permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
      - uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
      - uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Validate root module
        run: terraform validate
      - name: Init + validate child module
        run: |
          cd modules/project-foundation
          terraform init -backend=false
          terraform validate

  security-scan:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
      - name: tfsec scan (non-blocking while learning)
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.0
        with:
          working_directory: .
          soft_fail: "true"

  plan:
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
      - uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - id: gcp-auth
        uses: google-github-actions/auth@12060449e87204eca501a11f2f7f1483024afff0 # v2.1.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}
      - name: Terraform init
        run: terraform init -input=false
      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -out=tfplan -detailed-exitcode
          plan_exit=$?
          echo "exitcode=${plan_exit}" >> "$GITHUB_OUTPUT"
          if [ "${plan_exit}" -eq 1 ]; then
            echo "::error::terraform plan failed (exit 1)"
            exit 1
          fi
      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode != '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.0.0
        with:
          name: tfplan-${{ github.sha }}
          path: tfplan
          retention-days: 14
